[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "showup_squared_generator"
version = "1.0.0"
requires-python = ">=3.8"
dependencies = [
    "anthropic",
    "claude_api",
    "loguru",
    "numpy",
    "pandas",
    "python-dotenv",
    "openai",
    "python-docx",
    "Pillow",
    "markdown",
    "aiohttp",
    "azure-cognitiveservices-speech",
    "scikit-learn",
    "sentence-transformers",
    "setuptools",
    "tqdm",
    "pydantic",  # Added for strict schema definition
    "instructor" # Added for schema enforcement with OpenAI client
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest" # Added for running tests during development
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["showup_core*", "showup_tools*", "simplified_workflow*", "showup_editor_ui*"], exclude = ["tests", "dev_docs"]}}

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
# Configuration for pytest can be added here if needed to integrate with your AI Coder's test skipping
# For example, to ignore test files temporarily, though AGENTS.md is recommended for AI guidance:
# addopts = "--ignore=tests"
